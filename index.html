<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Редактор</title>
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-group">
      <span class="logo">Blocks</span>
      <select id="pages-select" class="pages-select" data-i18n-title="title.pages"></select>
      <button id="btn-add-page" class="btn btn-icon" data-i18n-title="title.addPage">+</button>
      <button id="btn-del-page" class="btn btn-icon btn-danger" data-i18n-title="title.delPage">🗑</button>
      <input id="page-title-input" class="page-title" type="text" data-i18n-placeholder="app.pageTitlePlaceholder">
    </div>
    <div class="topbar-group">
      <button class="device-btn active" data-device="desktop" data-i18n-title="title.desktop">🖥</button>
      <button class="device-btn" data-device="mobile" data-i18n-title="title.mobile">📱</button>
      <button class="device-btn lang-btn" data-lang="ru">RU</button>
      <button class="device-btn lang-btn" data-lang="en">EN</button>
      <button id="btn-preview" class="btn" data-i18n="app.preview">Превью</button>
    </div>
    <div class="topbar-group">
      <button id="btn-undo" class="btn btn-icon" data-i18n-title="title.undo">↶</button>
      <button id="btn-redo" class="btn btn-icon" data-i18n-title="title.redo">↷</button>
      <button id="btn-export" class="btn btn-primary" data-i18n="app.exportHtml">Экспорт HTML</button>
      <button id="btn-export-site" class="btn" data-i18n="app.exportSite">Экспорт сайта</button>
      <button id="btn-json" class="btn">JSON ↓</button>
      <button id="btn-import" class="btn">JSON ↑</button>
      <input type="file" id="file-json" accept=".json,application/json" hidden>
      <button id="btn-clear" class="btn btn-danger" data-i18n="app.clear">Очистить</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="panel left">
      <h2 data-i18n="app.blocks">Блоки</h2>
      <p class="panel-hint" data-i18n="app.blocksHint">Клик добавляет блок после выбранного.</p>
      <div id="library"></div>
    </aside>

    <section class="canvas-area">
      <div id="canvas-frame" class="canvas-frame device-desktop">
        <div id="canvas"></div>
      </div>
    </section>

    <aside class="panel right">
      <h2 data-i18n="app.fonts">Шрифты</h2>
      <div id="fonts-panel">
        <div class="font-add-row">
          <input id="font-name-input" type="text" data-i18n-placeholder="ph.fontName">
          <button id="btn-add-font" class="btn btn-icon" data-i18n-title="title.addFont">+</button>
        </div>
        <button id="btn-upload-font" class="btn-ghost" data-i18n="app.uploadFont">Загрузить с компьютера</button>
        <input type="file" id="file-font" accept=".ttf,.otf,.woff,.woff2" hidden>
        <div id="fonts-list"></div>
        <label class="fld fld-font-default"><span data-i18n="app.defaultFont">Шрифт всего сайта</span><select id="default-font-select"></select></label>
      </div>
      <h2 class="sec-head"><span data-i18n="app.layers">Слои</span><button id="btn-layers-toggle" class="sec-toggle" data-i18n-title="title.toggleLayers">−</button></h2>
      <div id="layers"></div>
      <h2 data-i18n="app.properties">Свойства</h2>
      <div id="inspector"></div>
    </aside>
  </main>

  <script src="js/site-css.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/blocks.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
